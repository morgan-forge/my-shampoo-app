<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lather</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --color-background: hsl(30, 20%, 98%);
      --color-surface: hsl(0, 0%, 100%);
      --color-text: hsl(30, 5%, 30%);
      --color-accent: hsl(150, 40%, 60%);
      --color-accent-dark: hsl(150, 40%, 50%);
      --color-low-stock: hsl(0, 70%, 70%);
      --color-border: hsl(30, 10%, 90%);
      --color-delete: hsl(350, 70%, 60%);
      --spacing-xs: 8px;
      --spacing-sm: 12px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --border-radius: 12px;
      --shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
      background-color: var(--color-background);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    body.auth-pending main,
    body.auth-pending footer,
    body.auth-pending header h1 {
      visibility: hidden;
    }

    .auth-gate {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-background);
      z-index: 300;
      padding: var(--spacing-lg);
      text-align: center;
      font-size: 1.1em;
      color: var(--color-text);
    }

    body:not(.auth-pending) .auth-gate {
      display: none;
    }

    header {
      padding: var(--spacing-lg) var(--spacing-md);
      text-align: center;
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 1.8em;
      color: var(--color-accent-dark);
    }

    main {
      flex-grow: 1;
      padding: var(--spacing-md);
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    #shampoo-list {
      display: grid;
      gap: var(--spacing-md);
    }

    .shampoo-card {
      background-color: var(--color-surface);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--color-border);
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      min-height: 120px;
    }

    .shampoo-card.low-stock {
      border-color: var(--color-low-stock);
      box-shadow: 0 4px 12px rgba(200, 80, 80, 0.12);
    }

    .shampoo-card.deleting {
      transform: translateX(-100%);
      opacity: 0;
    }

    .shampoo-info {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      flex-grow: 1;
    }

    .shampoo-name {
      font-weight: 600;
      font-size: 1.1em;
      color: var(--color-text);
      line-height: 1.2;
    }

    .shampoo-brand {
      font-size: 0.9em;
      color: var(--color-text);
      opacity: 0.7;
    }

    .fill-bar-container {
      width: 100%;
      height: 16px;
      background-color: var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .fill-bar {
      height: 100%;
      width: 0%;
      background-color: var(--color-accent);
      border-radius: 8px;
      transition: width 0.3s ease-out, background-color 0.3s ease-out;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: var(--spacing-xs);
      white-space: nowrap;
    }

    .shampoo-card.low-stock .fill-bar {
      background-color: var(--color-low-stock);
    }

    .fill-percentage {
      font-size: 0.8em;
      font-weight: 600;
      color: var(--color-surface);
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
    }

    .fill-percentage-low {
      color: var(--color-text);
      text-shadow: none;
    }

    .shampoo-notes {
      font-size: 0.85em;
      color: var(--color-text);
      opacity: 0.8;
      margin-top: var(--spacing-xs);
    }

    .low-stock-flag {
      font-size: 0.8em;
      font-weight: 600;
      color: var(--color-low-stock);
      margin-top: var(--spacing-xs);
      display: flex;
      align-items: center;
    }

    .low-stock-flag::before {
      content: '⚠️';
      margin-right: 4px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--color-surface);
      padding: var(--spacing-md);
      padding-bottom: calc(var(--spacing-md) + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.03);
      display: flex;
      justify-content: center;
      z-index: 100;
      border-top: 1px solid var(--color-border);
    }

    .button {
      background-color: var(--color-accent);
      color: var(--color-surface);
      border: none;
      border-radius: var(--border-radius);
      padding: var(--spacing-sm) var(--spacing-lg);
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .button:hover {
      background-color: var(--color-accent-dark);
    }

    .button.secondary {
      background-color: var(--color-border);
      color: var(--color-text);
    }

    .button.secondary:hover {
      background-color: hsl(30, 10%, 85%);
    }

    .button.delete {
      background-color: var(--color-delete);
      color: var(--color-surface);
    }

    .button.delete:hover {
      background-color: hsl(350, 70%, 50%);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background-color: var(--color-surface);
      border-radius: var(--border-radius);
      padding: var(--spacing-lg);
      width: 90%;
      max-width: 400px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-overlay.visible .modal-content {
      transform: translateY(0);
      opacity: 1;
    }

    .modal-content h2 {
      margin-top: 0;
      font-size: 1.5em;
      color: var(--color-text);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.9em;
      color: var(--color-text);
      opacity: 0.8;
    }

    .form-group input,
    .form-group textarea {
      padding: var(--spacing-sm);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius);
      font-family: var(--font-family);
      font-size: 1em;
      color: var(--color-text);
      background-color: var(--color-background);
      min-height: 44px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--color-accent);
      background-color: var(--color-surface);
    }

    .modal-actions {
      display: flex;
      gap: var(--spacing-md);
      justify-content: flex-end;
      margin-top: var(--spacing-sm);
    }

    #update-level-modal .modal-actions {
      justify-content: space-between;
    }

    #error-message {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: var(--color-delete);
      color: var(--color-surface);
      padding: var(--spacing-sm) var(--spacing-md);
      text-align: center;
      font-weight: 600;
      z-index: 250;
      transform: translateY(-100%);
      transition: transform 0.3s ease-out;
      box-shadow: var(--shadow);
    }

    #error-message.visible {
      transform: translateY(0);
    }

    #empty-state {
      text-align: center;
      padding: var(--spacing-lg);
      color: var(--color-text);
      opacity: 0.6;
      font-size: 1.1em;
      margin-top: var(--spacing-lg);
    }

    .header-row {
      display: grid;
      grid-template-columns: minmax(4.5rem, 1fr) auto minmax(4.5rem, 1fr);
      align-items: center;
      gap: var(--spacing-sm);
      max-width: 600px;
      margin: 0 auto;
    }

    .header-row h1 {
      margin: 0;
      text-align: center;
    }

    .header-actions {
      justify-self: end;
    }

    .sign-out-btn {
      background: transparent;
      border: none;
      color: var(--color-accent-dark);
      font-size: 0.9em;
      font-weight: 600;
      padding: var(--spacing-xs) var(--spacing-sm);
      cursor: pointer;
      min-height: 44px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .sign-out-btn:focus {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .auth-gate-inner {
      max-width: 340px;
      width: 100%;
    }

    .auth-gate-title {
      margin: 0 0 var(--spacing-sm);
      font-size: 1.5em;
      color: var(--color-accent-dark);
    }

    .auth-gate-sub {
      margin: 0 0 var(--spacing-lg);
      line-height: 1.45;
      opacity: 0.85;
    }

    .auth-gate-status {
      min-height: 1.25em;
      margin: 0 0 var(--spacing-md);
      font-size: 0.95em;
      color: var(--color-delete);
    }

    .auth-gate-status:empty {
      display: none;
    }

    .button-google {
      width: 100%;
      background: #fff;
      color: #3c4043;
      border: 1px solid #dadce0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .button-google:hover {
      background: #f8f9fa;
      border-color: #dadce0;
    }

    .button-google:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    @media (max-width: 400px) {
      .modal-content {
        width: 95%;
        padding: var(--spacing-md);
      }
      .button {
        font-size: 1em;
        padding: var(--spacing-sm) var(--spacing-md);
      }
    }
  </style>
</head>
<body class="auth-pending">
  <div id="auth-gate" class="auth-gate" role="dialog" aria-modal="true" aria-labelledby="auth-gate-title">
    <div class="auth-gate-inner">
      <h2 id="auth-gate-title" class="auth-gate-title">Welcome</h2>
      <p class="auth-gate-sub">Sign in with Google so your bottles stay in sync on your phone and computer.</p>
      <p id="auth-gate-message" class="auth-gate-status" role="status" aria-live="polite"></p>
      <button type="button" id="google-signin-btn" class="button button-google">Sign in with Google</button>
    </div>
  </div>

  <header>
    <div class="header-row">
      <div class="header-spacer" aria-hidden="true"></div>
      <h1>Lather</h1>
      <div class="header-actions">
        <button type="button" id="sign-out-btn" class="sign-out-btn" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <div id="shampoo-list"></div>
    <div id="empty-state" style="display: none;">
      Looks like your bathroom is empty! Tap the button below to add your first shampoo.
    </div>
  </main>

  <footer>
    <button type="button" id="add-shampoo-btn" class="button">+ Add Shampoo</button>
  </footer>

  <div id="add-shampoo-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="add-modal-title">
      <h2 id="add-modal-title">Add New Shampoo</h2>
      <form id="add-shampoo-form">
        <div class="form-group">
          <label for="new-name">Product Name</label>
          <input type="text" id="new-name" name="name" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="new-brand">Brand</label>
          <input type="text" id="new-brand" name="brand" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="new-totalMl">Total Volume (ml)</label>
          <input type="number" id="new-totalMl" name="totalMl" min="1" step="any" required>
        </div>
        <div class="form-group">
          <label for="new-startingAmount">Starting Amount (ml)</label>
          <input type="number" id="new-startingAmount" name="startingAmount" min="0" step="any" required>
        </div>
        <div class="form-group">
          <label for="new-notes">Notes (optional)</label>
          <textarea id="new-notes" name="notes" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="button secondary" data-close-modal="add-shampoo-modal">Cancel</button>
          <button type="submit" class="button">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <div id="update-level-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="update-modal-title">
      <h2 id="update-modal-title">Update Level</h2>
      <form id="update-level-form">
        <input type="hidden" id="update-id" name="id">
        <p>Updating: <strong id="update-product-name"></strong></p>
        <div class="form-group">
          <label for="update-remainingMl">Remaining Amount (ml)</label>
          <input type="number" id="update-remainingMl" name="remainingMl" min="0" step="any" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="button delete" id="delete-product-modal-btn">Delete</button>
          <div>
            <button type="button" class="button secondary" data-close-modal="update-level-modal">Cancel</button>
            <button type="submit" class="button">Update</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="error-message" role="alert"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyCe4iQIOq9_LZoILPC9Tj8iZs6S0DbBkhc',
      authDomain: 'my-shampoo.firebaseapp.com',
      projectId: 'my-shampoo',
      storageBucket: 'my-shampoo.firebasestorage.app',
      messagingSenderId: '171472528666',
      appId: '1:171472528666:web:0206df49515cea37c838a3',
      measurementId: 'G-0NRQQHLXWL'
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const shampooList = document.getElementById('shampoo-list');
    const emptyState = document.getElementById('empty-state');
    const addShampooBtn = document.getElementById('add-shampoo-btn');
    const addShampooModal = document.getElementById('add-shampoo-modal');
    const addShampooForm = document.getElementById('add-shampoo-form');
    const updateLevelModal = document.getElementById('update-level-modal');
    const updateLevelForm = document.getElementById('update-level-form');
    const updateProductName = document.getElementById('update-product-name');
    const deleteProductModalBtn = document.getElementById('delete-product-modal-btn');
    const errorMessageDiv = document.getElementById('error-message');
    const authGateMessage = document.getElementById('auth-gate-message');
    const googleSignInBtn = document.getElementById('google-signin-btn');
    const signOutBtn = document.getElementById('sign-out-btn');

    const googleProvider = new firebase.auth.GoogleAuthProvider();

    let currentShampoos = [];
    let currentUid = null;
    let listUnsubscribe = null;

    function shampoosCollectionRef() {
      return db.collection('users').doc(currentUid).collection('shampoos');
    }

    function showModal(modalId) {
      const el = document.getElementById(modalId);
      el.classList.add('visible');
      el.setAttribute('aria-hidden', 'false');
    }

    function closeModal(modalId) {
      const el = document.getElementById(modalId);
      el.classList.remove('visible');
      el.setAttribute('aria-hidden', 'true');
    }

    document.querySelectorAll('[data-close-modal]').forEach((btn) => {
      btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close-modal')));
    });

    function showErrorMessage(message, duration = 4000) {
      errorMessageDiv.textContent = message;
      errorMessageDiv.classList.add('visible');
      setTimeout(() => errorMessageDiv.classList.remove('visible'), duration);
    }

    function renderShampoos(shampoos) {
      shampooList.innerHTML = '';
      currentShampoos = shampoos;
      if (shampoos.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      shampoos.forEach((shampoo) => {
        const percentage = (shampoo.remainingMl / shampoo.totalMl) * 100;
        const isLowStock = percentage < 20;

        const card = document.createElement('div');
        card.className = `shampoo-card ${isLowStock ? 'low-stock' : ''}`;
        card.dataset.id = shampoo.id;
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Update ${shampoo.brand} ${shampoo.name}`);

        card.innerHTML = `
          <div class="shampoo-info">
            <span class="shampoo-brand">${escapeHtml(shampoo.brand)}</span>
            <span class="shampoo-name">${escapeHtml(shampoo.name)}</span>
            ${shampoo.notes ? `<p class="shampoo-notes">${escapeHtml(shampoo.notes)}</p>` : ''}
          </div>
          <div class="fill-bar-container">
            <div class="fill-bar" style="width: ${Math.min(100, Math.max(0, percentage))}%">
              <span class="fill-percentage ${percentage < 30 ? 'fill-percentage-low' : ''}">${Math.round(percentage)}%</span>
            </div>
          </div>
          ${isLowStock ? '<div class="low-stock-flag">Low stock!</div>' : ''}
        `;

        shampooList.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function detachListener() {
      if (listUnsubscribe) {
        listUnsubscribe();
        listUnsubscribe = null;
      }
    }

    function attachShampooListener() {
      detachListener();
      listUnsubscribe = shampoosCollectionRef()
        .orderBy('name', 'asc')
        .onSnapshot(
          (snapshot) => {
            const shampoos = [];
            snapshot.forEach((doc) => shampoos.push({ id: doc.id, ...doc.data() }));
            renderShampoos(shampoos);
          },
          (err) => {
            console.error(err);
            showErrorMessage('Could not load shampoos. Check connection and Firebase rules.');
          }
        );
    }

    addShampooBtn.addEventListener('click', () => {
      addShampooForm.reset();
      showModal('add-shampoo-modal');
    });

    addShampooForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUid) return;

      const name = document.getElementById('new-name').value.trim();
      const brand = document.getElementById('new-brand').value.trim();
      const totalMl = parseFloat(document.getElementById('new-totalMl').value);
      const startingAmount = parseFloat(document.getElementById('new-startingAmount').value);
      const notes = document.getElementById('new-notes').value.trim();

      if (!name || !brand || Number.isNaN(totalMl) || Number.isNaN(startingAmount) || totalMl <= 0 || startingAmount < 0 || startingAmount > totalMl) {
        showErrorMessage('Please enter valid product details. Starting amount cannot exceed total volume.');
        return;
      }

      const payload = {
        name,
        brand,
        totalMl,
        remainingMl: startingAmount,
        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (notes) payload.notes = notes;

      try {
        await shampoosCollectionRef().add(payload);
        closeModal('add-shampoo-modal');
      } catch (error) {
        console.error(error);
        showErrorMessage('Failed to add shampoo. Please try again.');
      }
    });

    shampooList.addEventListener('click', (e) => {
      const card = e.target.closest('.shampoo-card');
      if (!card) return;
      const id = card.dataset.id;
      const shampoo = currentShampoos.find((s) => s.id === id);
      if (!shampoo) return;
      document.getElementById('update-id').value = id;
      updateProductName.textContent = `${shampoo.brand} ${shampoo.name}`;
      document.getElementById('update-remainingMl').value = shampoo.remainingMl;
      document.getElementById('update-remainingMl').setAttribute('max', String(shampoo.totalMl));
      showModal('update-level-modal');
    });

    updateLevelForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('update-id').value;
      const remainingMl = parseFloat(document.getElementById('update-remainingMl').value);
      const shampoo = currentShampoos.find((s) => s.id === id);
      if (!shampoo) {
        showErrorMessage('Shampoo not found for update.');
        return;
      }
      if (Number.isNaN(remainingMl) || remainingMl < 0 || remainingMl > shampoo.totalMl) {
        showErrorMessage(`Please enter a valid remaining amount between 0 and ${shampoo.totalMl} ml.`);
        return;
      }
      try {
        await shampoosCollectionRef().doc(id).update({
          remainingMl,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal('update-level-modal');
      } catch (error) {
        console.error(error);
        showErrorMessage('Failed to update shampoo level. Please try again.');
      }
    });

    let pressTimer;
    shampooList.addEventListener('touchstart', (e) => {
      const card = e.target.closest('.shampoo-card');
      if (card) {
        pressTimer = setTimeout(() => handleDelete(card.dataset.id), 800);
      }
    });
    shampooList.addEventListener('touchend', () => clearTimeout(pressTimer));
    shampooList.addEventListener('touchmove', () => clearTimeout(pressTimer));
    shampooList.addEventListener('mousedown', (e) => {
      const card = e.target.closest('.shampoo-card');
      if (card) pressTimer = setTimeout(() => handleDelete(card.dataset.id), 800);
    });
    shampooList.addEventListener('mouseup', () => clearTimeout(pressTimer));
    shampooList.addEventListener('mouseleave', () => clearTimeout(pressTimer));

    deleteProductModalBtn.addEventListener('click', async () => {
      const id = document.getElementById('update-id').value;
      await handleDelete(id);
      closeModal('update-level-modal');
    });

    async function handleDelete(id) {
      if (!id || !confirm('Are you sure you want to delete this shampoo? This action cannot be undone.')) return;
      const card = [...shampooList.querySelectorAll('.shampoo-card')].find((c) => c.dataset.id === id);
      if (card) card.classList.add('deleting');
      try {
        await new Promise((r) => setTimeout(r, 200));
        await shampoosCollectionRef().doc(id).delete();
      } catch (error) {
        console.error(error);
        showErrorMessage('Failed to delete shampoo. Please try again.');
        if (card) card.classList.remove('deleting');
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('sw.js', { updateViaCache: 'none' })
          .catch((err) => console.warn('SW register failed', err));
      });
    }

    function startGoogleRedirect() {
      if (googleSignInBtn.disabled) return;
      authGateMessage.textContent = '';
      googleSignInBtn.disabled = true;
      auth
        .signInWithRedirect(googleProvider)
        .catch((err) => {
          console.error(err);
          googleSignInBtn.disabled = false;
          authGateMessage.textContent =
            err.message || 'Could not start Google sign-in. Check that Google is enabled in Firebase Console.';
        });
    }

    googleSignInBtn.addEventListener('click', (e) => {
      e.preventDefault();
      startGoogleRedirect();
    });

    googleSignInBtn.addEventListener(
      'touchend',
      (e) => {
        e.preventDefault();
        if (!googleSignInBtn.disabled) startGoogleRedirect();
      },
      { passive: false }
    );

    signOutBtn.addEventListener('click', () => {
      auth.signOut();
    });

    auth.getRedirectResult().catch((err) => {
      console.error(err);
      const gateHints = {
        'auth/operation-not-allowed':
          'Google sign-in is off. In Firebase Console: Authentication → Sign-in method → enable Google.',
        'auth/unauthorized-domain':
          'This domain is not allowed. Firebase → Authentication → Settings → Authorized domains → add this site’s host.'
      };
      if (err.code && gateHints[err.code]) {
        authGateMessage.textContent = gateHints[err.code];
      } else if (err.code) {
        showErrorMessage(err.message || 'Google sign-in failed. Try again.');
      }
    });

    auth.onAuthStateChanged((user) => {
      googleSignInBtn.disabled = false;

      if (!user) {
        detachListener();
        currentUid = null;
        currentShampoos = [];
        shampooList.innerHTML = '';
        emptyState.style.display = 'none';
        authGateMessage.textContent = '';
        document.body.classList.add('auth-pending');
        signOutBtn.hidden = true;
        return;
      }

      currentUid = user.uid;
      document.body.classList.remove('auth-pending');
      signOutBtn.hidden = false;
      attachShampooListener();
    });
  </script>
</body>
</html>
